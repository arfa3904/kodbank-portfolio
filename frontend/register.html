<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KODBANK</title>
    <link rel="stylesheet" href="css/bank.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">🏦</div>
                <h1>KODBANK</h1>
                <p class="tagline">Banking made simple</p>
            </div>
            <p class="sub">Create your bank account</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="Cname">Full name</label>
                    <input type="text" id="Cname" name="Cname" placeholder="Your name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="Cpwd">Password</label>
                    <input type="password" id="Cpwd" name="Cpwd" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <div id="message" class="msg"></div>
            <p class="link"><a href="/login.html">Already have an account? Sign In</a></p>
            <div class="secure-badge">
                <span>🔒</span>
                <span>Your data is secure</span>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const Cname = document.getElementById('Cname').value.trim();
            const email = document.getElementById('email').value.trim();
            const Cpwd = document.getElementById('Cpwd').value;
            const msg = document.getElementById('message');
            msg.className = 'msg';
            msg.textContent = '';
            try {
                const r = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ Cname, email, Cpwd })
                });
                const data = await r.json();
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = data.message + ' Redirecting to sign in...';
                    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Registration failed';
                }
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
